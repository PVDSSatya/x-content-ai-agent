name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  STAGING_DB_NAME: x-content-agent-staging
  PROD_DB_NAME: x-content-agent

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Ensure D1 Database & Apply Migrations (Staging)
        run: |
          set -euo pipefail
          DB_NAME="${{ env.STAGING_DB_NAME }}"
          echo "Checking D1 database: $DB_NAME"
          DB_LIST=$(npx wrangler d1 list --json)
          DB_ID=$(DB_LIST="$DB_LIST" DB_NAME="$DB_NAME" node -e '
            const list = JSON.parse(process.env.DB_LIST || "[]");
            const match = list.find((db) => db.name === process.env.DB_NAME);
            if (match?.uuid) process.stdout.write(match.uuid);
          ')
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database: $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
            DB_LIST=$(npx wrangler d1 list --json)
            DB_ID=$(DB_LIST="$DB_LIST" DB_NAME="$DB_NAME" node -e '
              const list = JSON.parse(process.env.DB_LIST || "[]");
              const match = list.find((db) => db.name === process.env.DB_NAME);
              if (match?.uuid) process.stdout.write(match.uuid);
            ')
          fi
          if [ -z "$DB_ID" ]; then
            echo "Error: Could not resolve D1 database ID for $DB_NAME"
            exit 1
          fi
          echo "Resolved staging D1 database ID: $DB_ID"
          DB_ID="$DB_ID" node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            cfg.env.staging.d1_databases[0].database_id = process.env.DB_ID;
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2));
          '
          npx wrangler d1 migrations apply "$DB_NAME" --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Ensure D1 Database & Apply Migrations (Production)
        run: |
          set -euo pipefail
          DB_NAME="${{ env.PROD_DB_NAME }}"
          echo "Checking D1 database: $DB_NAME"
          DB_LIST=$(npx wrangler d1 list --json)
          DB_ID=$(DB_LIST="$DB_LIST" DB_NAME="$DB_NAME" node -e '
            const list = JSON.parse(process.env.DB_LIST || "[]");
            const match = list.find((db) => db.name === process.env.DB_NAME);
            if (match?.uuid) process.stdout.write(match.uuid);
          ')
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database: $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
            DB_LIST=$(npx wrangler d1 list --json)
            DB_ID=$(DB_LIST="$DB_LIST" DB_NAME="$DB_NAME" node -e '
              const list = JSON.parse(process.env.DB_LIST || "[]");
              const match = list.find((db) => db.name === process.env.DB_NAME);
              if (match?.uuid) process.stdout.write(match.uuid);
            ')
          fi
          if [ -z "$DB_ID" ]; then
            echo "Error: Could not resolve D1 database ID for $DB_NAME"
            exit 1
          fi
          echo "Resolved production D1 database ID: $DB_ID"
          DB_ID="$DB_ID" node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            cfg.env.production.d1_databases[0].database_id = process.env.DB_ID;
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2));
          '
          npx wrangler d1 migrations apply "$DB_NAME" --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production