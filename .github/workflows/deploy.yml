name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DB_NAME: x-content-agent

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || echo "No build script, skipping"

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
          command: deploy --env staging

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build || echo "No build script, skipping"

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          command: deploy --env production

      - name: Run Database Migrations (Production)
        run: |
          echo "Checking/creating D1 database..."
          DB_OUTPUT=$(npx wrangler d1 create ${{ env.DB_NAME }} --env production --json 2>&1 || true)
          echo "$DB_OUTPUT"
          DB_ID=$(echo "$DB_OUTPUT" | jq -r '.result.id // empty' 2>/dev/null || echo "")
          if [ -z "$DB_ID" ]; then
            # Try to get existing database ID
            DB_LIST=$(npx wrangler d1 list --json 2>&1 || true)
            DB_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"${{ env.DB_NAME }}\") | .uuid" 2>/dev/null | head -1 || echo "")
          fi
          if [ -n "$DB_ID" ]; then
            echo "Database ID: $DB_ID"
            echo "Running migrations on database: $DB_ID"
            npx wrangler d1 migrations apply ${{ env.DB_NAME }} --env production
          else
            echo "Warning: Could not determine database ID, skipping migrations"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}