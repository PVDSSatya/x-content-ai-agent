name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-31b-it:free
          OPENROUTER_FALLBACK_MODEL: openrouter/free
          AI_MAX_TOKENS_PER_REQUEST: '4000'
          AI_MAX_TOTAL_TOKENS_PER_RUN: '50000'
          AI_TEMPERATURE: '0.7'
          AI_MAX_RETRIES: '3'
          AI_RETRY_BASE_DELAY_MS: '1000'
          RESEARCH_LOOKBACK_HOURS: '48'
          RESEARCH_MAX_TOPICS_PER_RUN: '20'
          RESEARCH_MIN_NOVELTY_SCORE: '0.6'
          RESEARCH_MIN_FRESHNESS_SCORE: '0.5'
          API_KEY: 'test-api-key'
          JWT_SECRET: 'test-jwt-secret'
          ENABLE_MOCK_INTEGRATIONS: 'true'

  check-deployment:
    name: Check Deployment
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Wrangler config
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --env staging --dry-run
          npx wrangler deploy --env production --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}